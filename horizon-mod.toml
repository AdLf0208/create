id = "create"
name = "Create"
version = "0.1.1"
description = """Create for Horizon — the kinetics engine plus the interop surface dependent add-ons bind to.
A pure bounded network solver in src/runtime.rs recognises shafts, cogwheels, the creative motor and the
mechanical press, propagates rotation across connected faces and charges stress as the sum of consumer
impacts scaled by speed. Every node publishes Speed, Capacity, Stress and NetworkStatus through its block
entity's saved NBT, the same shape an add-on reads from a neighbouring Create block. All art is regenerated
with zero jar-derived bytes; MIT code and upstream credit (The Create Team) travel with it."""
authors = ["The Create Team (Creators of Create)", "AdLf0208"]
api = "0.2"
side = "both"
capabilities = ["registries"]

